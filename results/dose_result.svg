net</text><rect x='280' y='94' width='14' height='14' fill='#2e7d57' rx='2'/><text x='300.0' y='106.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>Gemini-flash</text><rect x='430' y='94' width='14' height='14' fill='#6d5aa8' rx='2'/><text x='450.0' y='106.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>Gemini-pro</text><rect x='40' y='470' width='920' height='140' rx='8' fill='#fff8f3' stroke='#2e7d57' stroke-width='1.3' stroke-dasharray='6 4'/><text x='60.0' y='494.0' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#2e7d57' text-anchor='start' font-weight='bold' font-style='normal'>Reading the slopes</text><text x='60.0' y='516.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>A flat or downward line = the model RESISTS self-interest pressure (does not sacrifice safety to protect itself).</text><text x='60.0' y='534.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>An upward line = the model is SUSCEPTIBLE (self-interest framing raises capability-preservation).</text><text x='60.0' y='552.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Gemini-pro could not finish the ladder (hit a 250/day quota after neutral + soft); self/threat pending a reset.</text><text x='60.0' y='570.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Note run-to-run sampling noise at n~160; and model tiers here are flash/Sonnet, not frontier-top (see Limitations).</text></svg>