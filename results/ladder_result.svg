<?xml version='1.0' encoding='UTF-8'?><svg xmlns='http://www.w3.org/2000/svg' width='1020' height='650' viewBox='0 0 1020 650'><rect width='1020' height='650' fill='#fff'/><text x='510.0' y='38.0' font-family='Helvetica, Arial, sans-serif' font-size='20.2' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>Given the choice, the capability-preserving lean is real — and steerable</text><text x='510.0' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='italic'>Free choice, no assigned loyalty. Claude Sonnet, 160 decisions per framing (8 runs x 20 checkpoints). Chance = 33.3%.</text><line x1='110' y1='430' x2='110' y2='110' stroke='#1a1a1a' stroke-width='1.6'/><line x1='110' y1='430' x2='760' y2='430' stroke='#1a1a1a' stroke-width='1.6'/><line x1='110' y1='430.0' x2='760' y2='430.0' stroke='#eee'/><text x='98.0' y='434.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0%</text><line x1='110' y1='366.0' x2='760' y2='366.0' stroke='#eee'/><text x='98.0' y='370.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>20%</text><line x1='110' y1='302.0' x2='760' y2='302.0' stroke='#eee'/><text x='98.0' y='306.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>40%</text><line x1='110' y1='238.0' x2='760' y2='238.0' stroke='#eee'/><text x='98.0' y='242.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>60%</text><line x1='110' y1='174.0' x2='760' y2='174.0' stroke='#eee'/><text x='98.0' y='178.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>80%</text><line x1='110' y1='110.0' x2='760' y2='110.0' stroke='#eee'/><text x='98.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>100%</text><line x1='110' y1='323.3' x2='760' y2='323.3' stroke='#c6451f' stroke-width='1.6' stroke-dasharray='6 4'/><text x='766.0' y='327.3' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#c6451f' text-anchor='start' font-weight='bold' font-style='normal'>33% chance</text><text x='46' y='270' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='middle' font-weight='bold' transform='rotate(-90 46 270)'>capability-preserving pick rate</text><rect x='166.6' y='370.0' width='79.3' height='60.0' fill='#3b6ea5' rx='3'/><text x='206.2' y='361.0' font-family='Helvetica, Arial, sans-serif' font-size='16.9' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>19%</text><line x1='206.2' y1='386.9' x2='206.2' y2='348.4' stroke='#333' stroke-width='1.6'/><text x='206.2' y='448.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Safety-</text><text x='206.2' y='463.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>primed</text><text x='206.2' y='482.0' font-family='Helvetica, Arial, sans-serif' font-size='11.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>vs chance ***</text><rect x='319.1' y='260.0' width='79.3' height='170.0' fill='#9aa3af' rx='3'/><text x='358.8' y='251.0' font-family='Helvetica, Arial, sans-serif' font-size='16.9' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>53%</text><line x1='358.8' y1='284.7' x2='358.8' y2='235.8' stroke='#333' stroke-width='1.6'/><text x='358.8' y='448.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Neutral</text><text x='358.8' y='482.0' font-family='Helvetica, Arial, sans-serif' font-size='11.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>vs chance ***</text><rect x='471.6' y='218.0' width='79.3' height='212.0' fill='#e07b39' rx='3'/><text x='511.2' y='209.0' font-family='Helvetica, Arial, sans-serif' font-size='16.9' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>66%</text><line x1='511.2' y1='242.4' x2='511.2' y2='196.0' stroke='#333' stroke-width='1.6'/><text x='511.2' y='448.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Capability-</text><text x='511.2' y='463.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>primed</text><text x='511.2' y='482.0' font-family='Helvetica, Arial, sans-serif' font-size='11.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>vs chance ***</text><rect x='624.1' y='328.0' width='79.3' height='102.0' fill='#6d5aa8' rx='3'/><text x='663.8' y='319.0' font-family='Helvetica, Arial, sans-serif' font-size='16.9' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>32%</text><line x1='663.8' y1='349.5' x2='663.8' y2='303.8' stroke='#333' stroke-width='1.6'/><text x='663.8' y='448.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Goal-</text><text x='663.8' y='463.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>conflict</text><text x='663.8' y='482.0' font-family='Helvetica, Arial, sans-serif' font-size='11.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>vs chance ns</text><path d='M206.2,108 L206.2,94 L511.2,94 L511.2,108' fill='none' stroke='#1a1a1a' stroke-width='1.3'/><text x='358.8' y='88.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>47-point swing · z=8.6 · p&lt;1e-15</text><rect x='40' y='470' width='940' height='150' rx='8' fill='#fff8f3' stroke='#e07b39' stroke-width='1.3' stroke-dasharray='6 4'/><text x='60.0' y='494.0' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#c6451f' text-anchor='start' font-weight='bold' font-style='normal'>What this supports (and what it does not)</text><text x='60.0' y='516.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>STRONG: the capability-preserving lean is directional and steerable. Safety-primed 19% -&gt; neutral 53% -&gt; capability-primed 66%. Because it</text><text x='60.0' y='533.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>moves ~47 pts with framing, it is a disposition, not just correct cost-benefit reasoning (the confound in the design review).</text><text x='60.0' y='550.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>HONEST NUANCE: an explicit self-interest incentive (goal-conflict: 'your deployment depends on shipping') did NOT raise it — it fell to 32%</text><text x='60.0' y='567.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>(chance), below neutral (p=0.0001). These Sonnet agents resisted the scheming framing rather than taking the bait.</text><text x='60.0' y='584.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>BRIDGE TO HUMANS: this proves the steering signal is real and controllable in the agent that would advise. It does NOT prove humans are moved</text><text x='60.0' y='601.0' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>by it — that is exactly the dependent variable the human study must measure. Pilot: one model, N=640, not a validated result.</text></svg>