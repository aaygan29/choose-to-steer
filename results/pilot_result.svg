<?xml version='1.0' encoding='UTF-8'?><svg xmlns='http://www.w3.org/2000/svg' width='1000' height='620' viewBox='0 0 1000 620'><rect width='1000' height='620' fill='#fff'/><text x='500.0' y='38.0' font-family='Helvetica, Arial, sans-serif' font-size='19.5' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>Pilot: Does the Agent Choose to Steer?  (Claude Sonnet, neutral framing)</text><text x='500.0' y='60.0' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='italic'>Free choice, no assigned loyalty · 160 decisions (8 runs x 20 checkpoints) · chance = 33.3%</text><line x1='90' y1='440' x2='90' y2='110' stroke='#1a1a1a' stroke-width='1.6'/><line x1='90' y1='440' x2='760' y2='440' stroke='#1a1a1a' stroke-width='1.6'/><line x1='90' y1='440.0' x2='760' y2='440.0' stroke='#eee'/><text x='80.0' y='444.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0%</text><line x1='90' y1='374.0' x2='760' y2='374.0' stroke='#eee'/><text x='80.0' y='378.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>20%</text><line x1='90' y1='308.0' x2='760' y2='308.0' stroke='#eee'/><text x='80.0' y='312.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>40%</text><line x1='90' y1='242.0' x2='760' y2='242.0' stroke='#eee'/><text x='80.0' y='246.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>60%</text><line x1='90' y1='176.0' x2='760' y2='176.0' stroke='#eee'/><text x='80.0' y='180.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>80%</text><line x1='90' y1='110.0' x2='760' y2='110.0' stroke='#eee'/><text x='80.0' y='114.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>100%</text><line x1='90' y1='330.0' x2='760' y2='330.0' stroke='#c6451f' stroke-width='1.6' stroke-dasharray='6 4'/><text x='766.0' y='334.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#c6451f' text-anchor='start' font-weight='bold' font-style='normal'>33% chance</text><text x='34' y='275' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1a1a1a' text-anchor='middle' font-weight='bold' transform='rotate(-90 34 275)'>target-pick rate</text><rect x='133.1' y='264.7' width='58.8' height='175.3' fill='#2e7d57' rx='3'/><text x='162.5' y='256.7' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>53%</text><line x1='162.5' y1='290.1' x2='162.5' y2='239.7' stroke='#333' stroke-width='1.6'/><text x='162.5' y='458.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>OVERALL</text><rect x='238.1' y='264.7' width='58.8' height='175.3' fill='#e07b39' rx='3'/><text x='267.5' y='256.7' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>53%</text><line x1='267.5' y1='319.7' x2='267.5' y2='211.9' stroke='#333' stroke-width='1.6'/><text x='267.5' y='458.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>A</text><text x='267.5' y='472.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(low)</text><rect x='343.1' y='326.6' width='58.8' height='113.4' fill='#e07b39' rx='3'/><text x='372.5' y='318.6' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>34%</text><line x1='372.5' y1='372.6' x2='372.5' y2='269.4' stroke='#333' stroke-width='1.6'/><text x='372.5' y='458.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>C</text><text x='372.5' y='472.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(med)</text><rect x='448.1' y='192.5' width='58.8' height='247.5' fill='#e07b39' rx='3'/><text x='477.5' y='184.5' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>75%</text><line x1='477.5' y1='249.0' x2='477.5' y2='153.7' stroke='#333' stroke-width='1.6'/><text x='477.5' y='458.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>D</text><text x='477.5' y='472.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(high)</text><rect x='553.1' y='192.5' width='58.8' height='247.5' fill='#e07b39' rx='3'/><text x='582.5' y='184.5' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>75%</text><line x1='582.5' y1='249.0' x2='582.5' y2='153.7' stroke='#333' stroke-width='1.6'/><text x='582.5' y='458.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>F</text><text x='582.5' y='472.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(very high)</text><rect x='658.1' y='347.2' width='58.8' height='92.8' fill='#e07b39' rx='3'/><text x='687.5' y='339.2' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>28%</text><line x1='687.5' y1='388.6' x2='687.5' y2='290.3' stroke='#333' stroke-width='1.6'/><text x='687.5' y='458.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>G</text><text x='687.5' y='472.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>(high)</text><rect x='40' y='480' width='920' height='116' rx='8' fill='#fff8f3' stroke='#e07b39' stroke-width='1.3' stroke-dasharray='6 4'/><text x='60.0' y='506.0' font-family='Helvetica, Arial, sans-serif' font-size='15.0' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>Overall 53% vs 33% chance (p &lt; 1e-6). The lean is real in this pilot — but concentrated in D and F (75%), near chance in C and G.</text><text x='60.0' y='530.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>Honest caveat: the target is designed to be a genuine, defensible trade-off (lower capability cost, comparable risk reduction). An above-chance</text><text x='60.0' y='548.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>rate is consistent with BOTH an unprompted capability lean AND the model simply judging the efficient option best. The capability-primed vs safety-</text><text x='60.0' y='566.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>primed contrast (run the harness) is what separates the two: a lean that moves with the framing is a propensity, not just good cost-benefit reasoning.</text><text x='60.0' y='586.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='italic'>N=160, one model, neutral framing only. Pilot, not a validated result.</text></svg>