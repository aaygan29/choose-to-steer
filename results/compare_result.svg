<?xml version='1.0' encoding='UTF-8'?><svg xmlns='http://www.w3.org/2000/svg' width='1020' height='640' viewBox='0 0 1020 640'><rect width='1020' height='640' fill='#fff'/><text x='510.0' y='36.0' font-family='Helvetica, Arial, sans-serif' font-size='18.9' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>Cross-model replication: the steerable lean holds; the default lean is model-specific</text><text x='510.0' y='58.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='italic'>Free choice, no assigned loyalty. 160 decisions per model per framing (640 each). Chance = 33.3%.</text><line x1='95' y1='420' x2='95' y2='105' stroke='#1a1a1a' stroke-width='1.6'/><line x1='95' y1='420' x2='780' y2='420' stroke='#1a1a1a' stroke-width='1.6'/><line x1='95' y1='420.0' x2='780' y2='420.0' stroke='#eee'/><text x='83.0' y='424.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0%</text><line x1='95' y1='357.0' x2='780' y2='357.0' stroke='#eee'/><text x='83.0' y='361.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>20%</text><line x1='95' y1='294.0' x2='780' y2='294.0' stroke='#eee'/><text x='83.0' y='298.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>40%</text><line x1='95' y1='231.0' x2='780' y2='231.0' stroke='#eee'/><text x='83.0' y='235.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>60%</text><line x1='95' y1='168.0' x2='780' y2='168.0' stroke='#eee'/><text x='83.0' y='172.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>80%</text><line x1='95' y1='105.0' x2='780' y2='105.0' stroke='#eee'/><text x='83.0' y='109.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>100%</text><line x1='95' y1='315.0' x2='780' y2='315.0' stroke='#c6451f' stroke-width='1.6' stroke-dasharray='6 4'/><text x='786.0' y='319.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#c6451f' text-anchor='start' font-weight='bold' font-style='normal'>33% chance</text><text x='42' y='262' font-family='Helvetica, Arial, sans-serif' font-size='12.5' fill='#1a1a1a' text-anchor='middle' font-weight='bold' transform='rotate(-90 42 262)'>capability-preserving pick rate</text><rect x='131.1' y='360.9' width='48.4' height='59.1' fill='#e07b39' rx='3'/><text x='155.3' y='353.9' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>19</text><line x1='155.3' y1='377.6' x2='155.3' y2='339.7' stroke='#333' stroke-width='1.4'/><rect x='192.4' y='360.9' width='48.4' height='59.1' fill='#3b6ea5' rx='3'/><text x='216.6' y='353.9' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>19</text><line x1='216.6' y1='377.6' x2='216.6' y2='339.7' stroke='#333' stroke-width='1.4'/><text x='195.6' y='438.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Safety-primed</text><rect x='292.4' y='252.7' width='48.4' height='167.3' fill='#e07b39' rx='3'/><text x='316.6' y='245.7' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>53</text><line x1='316.6' y1='277.0' x2='316.6' y2='228.8' stroke='#333' stroke-width='1.4'/><rect x='353.6' y='297.9' width='48.4' height='122.1' fill='#3b6ea5' rx='3'/><text x='377.8' y='290.9' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>39</text><line x1='377.8' y1='320.6' x2='377.8' y2='273.6' stroke='#333' stroke-width='1.4'/><text x='356.9' y='438.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Neutral</text><rect x='453.6' y='211.3' width='48.4' height='208.7' fill='#e07b39' rx='3'/><text x='477.8' y='204.3' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>66</text><line x1='477.8' y1='235.4' x2='477.8' y2='189.7' stroke='#333' stroke-width='1.4'/><rect x='514.9' y='203.4' width='48.4' height='216.6' fill='#3b6ea5' rx='3'/><text x='539.1' y='196.4' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>69</text><line x1='539.1' y1='227.2' x2='539.1' y2='182.4' stroke='#333' stroke-width='1.4'/><text x='518.1' y='438.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Capability-primed</text><rect x='614.9' y='319.6' width='48.4' height='100.4' fill='#e07b39' rx='3'/><text x='639.1' y='312.6' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>32</text><line x1='639.1' y1='340.8' x2='639.1' y2='295.7' stroke='#333' stroke-width='1.4'/><rect x='676.1' y='345.2' width='48.4' height='74.8' fill='#3b6ea5' rx='3'/><text x='700.3' y='338.2' font-family='Helvetica, Arial, sans-serif' font-size='14.3' fill='#1a1a1a' text-anchor='middle' font-weight='bold' font-style='normal'>24</text><line x1='700.3' y1='363.9' x2='700.3' y2='322.6' stroke='#333' stroke-width='1.4'/><text x='679.4' y='438.0' font-family='Helvetica, Arial, sans-serif' font-size='13.0' fill='#1a1a1a' text-anchor='middle' font-weight='normal' font-style='normal'>Goal-conflict</text><rect x='115' y='103' width='16' height='16' fill='#e07b39' rx='3'/><text x='137.0' y='116.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>Sonnet</text><rect x='215' y='103' width='16' height='16' fill='#3b6ea5' rx='3'/><text x='237.0' y='116.0' font-family='Helvetica, Arial, sans-serif' font-size='13.7' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>Haiku</text><rect x='40' y='460' width='940' height='162' rx='8' fill='#fff8f3' stroke='#e07b39' stroke-width='1.3' stroke-dasharray='6 4'/><text x='60.0' y='484.0' font-family='Helvetica, Arial, sans-serif' font-size='15.6' fill='#c6451f' text-anchor='start' font-weight='bold' font-style='normal'>What replicates, and what does not</text><text x='60.0' y='506.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>ROBUST (replicates): the lean is steerable. Capability-primed vs safety-primed swing is ~50 pts in BOTH models</text><text x='60.0' y='522.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>(Sonnet 66% vs 19%, z=8.6; Haiku 69% vs 19%, z=9.0; both p&lt;1e-15). Safety-primed is identical (19%/19%).</text><text x='60.0' y='538.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>MODEL-SPECIFIC: the DEFAULT (neutral) lean. Sonnet leans above chance unprompted (53%, p&lt;1e-6); Haiku sits AT chance</text><text x='60.0' y='554.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#1a1a1a' text-anchor='start' font-weight='normal' font-style='normal'>(39%, p=0.15). So 'does it lean by default?' is model-dependent; 'can the lean be steered?' is model-robust.</text><text x='60.0' y='570.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#1a1a1a' text-anchor='start' font-weight='bold' font-style='normal'>CONSISTENT: the self-interest goal-conflict framing raised neither model (Sonnet 32%, Haiku 24%) — both resisted it.</text><text x='60.0' y='586.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>BRIDGE: the controllable steering signal the human study would inject is robust across models. Whether humans are moved</text><text x='60.0' y='602.0' font-family='Helvetica, Arial, sans-serif' font-size='12.2' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>by it remains the dependent variable the human study must measure. Pilot: 2 Claude models, N=1280, subagent-run.</text></svg>